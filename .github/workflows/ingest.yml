name: Scheduled ingestion (production)

# The hosted API runs on Vercel (serverless), which has no always-on worker. Every 5 minutes
# this workflow calls POST /api/v1/ingest/tick. The API itself decides which jobs are due
# (FAA 5 min, METAR 10 min, TAF 30 min, risk 10 min, bronze purge daily) and runs them under
# an advisory lock, so extra or overlapping calls cannot increase upstream polling — which is
# why no secret is required. GitHub cron is best-effort; any lag shows up as
# "delayed"/"stale" freshness in the app, never as fabricated live data.
#
# Configure the repository variable AEROPULSE_API_URL (Settings → Variables → Actions).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.AEROPULSE_API_URL }}
    steps:
      - name: Skip when not configured
        if: env.API_URL == ''
        run: echo "AEROPULSE_API_URL is not set; nothing to do."
      - name: Run due ingestion jobs
        if: env.API_URL != ''
        run: |
          curl -sS --fail-with-body --max-time 240 --retry 2 --retry-delay 15 \
            -X POST "${API_URL%/}/api/v1/ingest/tick"
          echo
