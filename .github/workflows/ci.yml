name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPASSWORD: ci-password

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: aeropulse
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aeropulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aeropulse" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aeropulse:ci-password@localhost:5432/aeropulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Lint pipeline and BI scripts
        run: uv run ruff check ../../pipelines ../../analytics && uv run ruff format --check ../../pipelines ../../analytics
      - run: uv run pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Dependency audit
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --strict --disable-pip

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end smoke (empty database)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: aeropulse
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aeropulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aeropulse" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://aeropulse:ci-password@localhost:5432/aeropulse
      CORS_ALLOW_ORIGINS: http://localhost:3100
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start API (migrated, seeded, no ingestion -> exercises empty states)
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.cli seed
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && break; sleep 1; done
      - name: Build web
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - if: failure()
        run: cat /tmp/api.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  powerbi:
    name: Power BI project validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Fetch Microsoft report schemas
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/microsoft/json-schemas.git /tmp/json-schemas
          git -C /tmp/json-schemas sparse-checkout set fabric/item/report
          curl -sSfL -o /tmp/reportThemeSchema.json \
            "https://raw.githubusercontent.com/microsoft/powerbi-desktop-samples/main/Report%20Theme%20JSON%20Schema/reportThemeSchema-2.159.json"
      - name: Regenerate (must match committed files) and validate
        run: |
          uv run --project services/api --group pipeline python analytics/powerbi/generate_pbip.py
          git diff --exit-code -- analytics/powerbi analytics/dax
          uv run --project services/api --group pipeline python analytics/powerbi/validate_pbip.py \
            --schemas /tmp/json-schemas --theme-schema /tmp/reportThemeSchema.json

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aeropulse-api ./services/api
      - run: docker build -t aeropulse-web ./apps/web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
